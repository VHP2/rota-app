name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Write strings.xml
        run: |
          cat > android/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">ROTA</string>
            <string name="title_activity_main">ROTA</string>
            <string name="package_name">com.rotaapp.viagens</string>
            <string name="custom_url_scheme">com.rotaapp.viagens</string>
          </resources>
          EOF

      - name: Write styles.xml
        run: |
          cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
              <item name="android:statusBarColor">#181C24</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowBackground">#0F1117</item>
              <item name="android:navigationBarColor">#0F1117</item>
              <item name="android:windowLightNavigationBar">false</item>
            </style>
            <style name="AppTheme.NoActionBar">
              <item name="windowActionBar">false</item>
              <item name="windowNoTitle">true</item>
              <item name="android:background">#0F1117</item>
            </style>
            <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
              <item name="android:background">#0F1117</item>
              <item name="postSplashScreenTheme">@style/AppTheme</item>
            </style>
          </resources>
          EOF

      - name: Patch build.gradle
        run: |
          cat > android/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace "com.rotaapp.viagens"
              compileSdkVersion 34

              defaultConfig {
                  applicationId "com.rotaapp.viagens"
                  minSdkVersion 22
                  targetSdkVersion 34
                  versionCode 1
                  versionName "2.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled fa
